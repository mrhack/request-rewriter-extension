<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #3a3a5a; }
  * { scrollbar-width: thin; scrollbar-color: #2a2a4a transparent; }
  .card-title { line-height: 18px; min-height: 18px; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; width: 400px; background: #1a1a2e; color: #eee; }
  #log { position: fixed; top: 0; right: 0; width: 300px; height: 100vh; background: #000; color: #0f0; font-family: monospace; font-size: 11px; padding: 8px; overflow-y: auto; z-index: 99999; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="app" style="border-radius: 0; overflow: hidden;">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid #2a2a4a;">
    <span style="font-size: 15px; font-weight: 600;">🔧 API Interceptor</span>
    <div style="display: flex; gap: 6px;">
      <button class="btn-import" style="background: #0f3460; border: none; color: #eee; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px;">📥</button>
      <button class="btn-export" style="background: #0f3460; border: none; color: #eee; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px;">📤</button>
      <button class="btn-new" style="background: #e94560; border: none; color: #fff; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 14px; font-weight: 600;">＋</button>
    </div>
  </div>
  <div id="card-container" style="padding: 8px 10px; display: flex; flex-direction: column; gap: 8px; max-height: 560px; overflow-y: auto;"></div>
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-top: 1px solid #2a2a4a;">
    <span id="status-text" style="font-size: 12px; color: #888;">未启用</span>
    <button id="toggle-btn" style="background: #0b57d0; border: none; color: #fff; border-radius: 6px; padding: 6px 16px; cursor: pointer; font-size: 12px; font-weight: 600;">启用当前页</button>
  </div>
</div>
<div id="log"></div>
<script type="module" src="mock-test.js"></script>
</body>
</html>
